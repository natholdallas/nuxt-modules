name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # This repository is a git submodule consumed inside a pnpm workspace; it
      # has no package.json/workspace of its own, so a plain `pnpm install` here
      # would not resolve the `workspace:*` links. Validate what can be checked
      # standalone instead: formatting and package manifest consistency.
      - name: Verify package manifests
        run: |
          node -e '
            const fs = require("fs");
            const dirs = fs.readdirSync(".").filter((d) => fs.existsSync(`${d}/package.json`));
            let bad = 0;
            for (const d of dirs) {
              const p = JSON.parse(fs.readFileSync(`${d}/package.json`, "utf8"));
              if (!p.name?.startsWith("@natholdallas/")) { console.error(`${d}: bad name`); bad++; }
              if (!p.version) { console.error(`${d}: missing version`); bad++; }
              if (p.main !== "index.ts") { console.error(`${d}: main must be index.ts`); bad++; }
              if (p.types !== "index.ts") { console.error(`${d}: missing types`); bad++; }
              if (!p.exports?.["."]) { console.error(`${d}: missing exports["."]`); bad++; }
              if (!fs.existsSync(`${d}/index.ts`)) { console.error(`${d}: missing index.ts`); bad++; }
            }
            if (bad) process.exit(1);
            console.log(`validated ${dirs.length} packages`);
          '

      - name: Check formatting
        run: npx --yes prettier@3 --check .
